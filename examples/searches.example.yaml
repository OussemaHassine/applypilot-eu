# ApplyPilot search configuration (example) (updated 2026-11-02: anywhere in Europe or remote).
# Keys below are the ones the code actually reads (the shipped example is partly stale).
# Edit freely, then re-run: applypilot run discover

defaults:
  country_indeed: "italy"   # default Indeed country site; per-location override below
  results_per_site: 25      # per board per query per location
  hours_old: 72             # only postings from the last 3 days (use 24 for daily runs)

# Boards. zip_recruiter is US/Canada only, so it is left out.
sites:
  - indeed
  - linkedin
  # glassdoor removed 2026-11-02: ApplyPilot blocks glassdoor URLs from enrichment and apply,
  # so its 960+ results were dead weight (and the board rate-limits the crawler).
  - google

# Tier 1 = core QA roles, Tier 2 = adjacent + AI roles, Tier 3 = wide net.
# Workday portals only use tiers <= workday_max_tier.
queries:
  - { query: "QA Engineer", tier: 1 }
  - { query: "QA Automation Engineer", tier: 1 }
  - { query: "Test Automation Engineer", tier: 1 }
  - { query: "Software Test Engineer", tier: 1 }
  - { query: "SDET", tier: 1 }
  - { query: "Quality Assurance Engineer", tier: 1 }
  - { query: "Software Tester", tier: 2 }
  - { query: "Playwright automation", tier: 2 }
  - { query: "AI QA Engineer", tier: 2 }
  - { query: "Ingénieur QA", tier: 2 }
  - { query: "Testeur logiciel", tier: 2 }
  - { query: "Automation Engineer", tier: 3 }
  - { query: "Quality Engineer", tier: 3 }
  - { query: "AI Engineer", tier: 3 }
  - { query: "LLM Engineer", tier: 3 }
  # Added 2026-11-02 04:50 after the first pool was exhausted (69 applications)
  - { query: "Test Engineer", tier: 1 }
  - { query: "QA Analyst", tier: 1 }
  - { query: "Test Analyst", tier: 1 }
  - { query: "QA Specialist", tier: 2 }
  - { query: "Software QA", tier: 2 }
  - { query: "Test Automation", tier: 2 }
  - { query: "AI Test Engineer", tier: 2 }
  - { query: "Ingegnere QA", tier: 2 }
  - { query: "Ingeniero QA", tier: 2 }
  - { query: "Quality Analyst", tier: 3 }

# Each query runs once per location. Country searches use remote: false so they return
# onsite, hybrid AND remote postings; the EU search adds a remote-only sweep.
# country_indeed picks the Indeed country site (local patch in discovery/jobspy.py).
locations:
  - { location: "Italy", remote: false, label: "italy", country_indeed: "italy" }
  - { location: "France", remote: false, label: "france", country_indeed: "france" }
  - { location: "Germany", remote: false, label: "germany", country_indeed: "germany" }
  - { location: "Netherlands", remote: false, label: "netherlands", country_indeed: "netherlands" }
  - { location: "Spain", remote: false, label: "spain", country_indeed: "spain" }
  - { location: "Portugal", remote: false, label: "portugal", country_indeed: "portugal" }
  - { location: "Belgium", remote: false, label: "belgium", country_indeed: "belgium" }
  - { location: "Ireland", remote: false, label: "ireland", country_indeed: "ireland" }
  - { location: "Switzerland", remote: false, label: "switzerland", country_indeed: "switzerland" }
  - { location: "Austria", remote: false, label: "austria", country_indeed: "austria" }
  - { location: "Poland", remote: false, label: "poland", country_indeed: "poland" }
  - { location: "Sweden", remote: false, label: "sweden", country_indeed: "sweden" }
  - { location: "Denmark", remote: false, label: "denmark", country_indeed: "denmark" }
  - { location: "United Kingdom", remote: false, label: "uk", country_indeed: "uk" }
  - { location: "European Union", remote: true, label: "eu-remote", country_indeed: "italy" }
  # More European markets 
  - { location: "Norway", remote: false, label: "norway", country_indeed: "norway" }
  - { location: "Finland", remote: false, label: "finland", country_indeed: "finland" }
  - { location: "Czech Republic", remote: false, label: "czechia", country_indeed: "czech republic" }
  - { location: "Hungary", remote: false, label: "hungary", country_indeed: "hungary" }
  - { location: "Romania", remote: false, label: "romania", country_indeed: "romania" }
  - { location: "Greece", remote: false, label: "greece", country_indeed: "greece" }
  - { location: "Luxembourg", remote: false, label: "luxembourg", country_indeed: "luxembourg" }
  # Gulf 
  - { location: "United Arab Emirates", remote: false, label: "uae", country_indeed: "united arab emirates" }
  - { location: "Qatar", remote: false, label: "qatar", country_indeed: "qatar" }
  - { location: "Saudi Arabia", remote: false, label: "saudi", country_indeed: "saudi arabia" }

